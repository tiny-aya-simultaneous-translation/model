# TPU v6e-16 SMOKE test, ARM B (Stage-2 near-tie): r=8, lr=2.795e-4.
#
# See stage2_tpu_v6e16_smoke_r32.yaml for the full rationale. This arm is
# the Stage-2 sweep's near-tie runner-up (val/composite=5.1327 vs the r=32
# winner's 5.1189) -- 4x fewer LoRA params for a tiny quality gap. Runs in
# PARALLEL with the r=32 and r=64 arms on a separate v6e-16 slice (2nd slice
# in europe-west4-a) so the smoke phase finishes in ~9h instead of ~27h
# sequential.

backend: tpu

data:
  encoded_dir: /mnt/data/encoded
  train_split: /mnt/data/splits/train.jsonl
  val_split: /mnt/data/splits/val.jsonl
  max_frames: 300
  audio_frame_rate: 12.5
  num_workers: 32
  pin_memory: false

train:
  weight_decay: 0.01
  num_codebooks: 8
  batch_size: 4
  grad_accum: 4
  max_steps: 5000
  warmup_steps: 50
  min_lr_ratio: 0.0
  early_stop_patience: 6
  compile_warmup_steps: 1
  enable_clip_grad_norm: true
  clip_grad_norm: 1.0
  log_grad_norm: true
  fsdp_barrier_hook: false
  depth_chunk_size: 16
  precision: bfloat16
  use_scan_layers: false
  xla_grad_checkpoint: true
  final_canonical_save: false

loss:
  text_weight: 0.0
  audio_weight: 1.0
  text_weight_curriculum_frac: 0.0
  composite_text_w: 0.0
  composite_audio_w: 1.0
  text_padding_weight: 0.01
  zero_padding_weight: 0.0
  label_smoothing: 0.1
  per_codebook_multipliers: [1.0, 1.0, 1.5, 1.5, 2.0, 2.0, 2.0, 2.0]
  progressive_unmask_fraction: 0.10
  unmask_k0: 1

lora:
  r: 8                              # Stage-2 near-tie
  alpha: 16                         # 2 x r
  dropout: 0.05
  use_rslora: true
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, embed_tokens]
  lora_exclude_top: 2
  num_full_ft_layers: 0
  depth_unfreeze_blocks: 0

optim:
  lr_lora: 2.795e-4                 # Stage-2 sweep run ixi7pelb
  lr_full_ft: 5.0e-5
  lr_projection: 5.0e-4
  lr_depth: 1.0e-4
  lr_depth_blocks: 1.0e-5
  lr_audio_embed: 5.0e-4
  lr_text_embed: 5.0e-4

logging:
  log_every: 25
  save_every: 500
  audio_every: 1000000
  val_every: 250
  val_max_batches: 25
  val_on_tpu: true
  diag_metrics: false
  save_dir: gs://tinyaya-stage2-eu/checkpoints/stage2-tpu-v6e16-smoke-r8
  keep_last_n: 0
  keep_local_checkpoints: false
  use_wandb: true
  wandb_project: tinyaya-stage2-tpu
  wandb_run_name: v0.3-smoke-r8

perf:
  enabled: true
  warmup_skip_steps: 25
  xprof_trace_labels: false
