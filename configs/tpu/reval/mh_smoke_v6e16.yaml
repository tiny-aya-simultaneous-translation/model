# Multi-host DP validation smoke (v6e-16, 4 hosts x 4 chips). per_chip_batch
# 2 -> per-host 8 -> GLOBAL 32 assembled across hosts by the minibatch pipeline
# (Phase A). debug_input_sharding prints the global (32,300) logical shape.
# Gate: text_ids logical shape[0]==32, loss finite + falling, val runs.
# GENERATED arm-recipe smoke -- validates every path the reval arms use:
# _ScanSafeDropout (dropout=0.05 under scan) + scan_homogeneous LoRA
# (exclude_top=2 as frozen zero adapters on ALL 36 layers) + TEXT+AUDIO
# (text_weight 0.2 via the fixed alignment loader). Gate: train text loss
# < 11.5 and falling (not stuck at ln(vocab)~12.5), val/text_acc > 0.
backend: tpu
data:
  encoded_dir: /mnt/data/encoded
  train_split: /mnt/data/splits/train.jsonl
  val_split: /mnt/data/splits/val.jsonl
  max_frames: 300
  audio_frame_rate: 12.5
  num_workers: 32
  pin_memory: false
train:
  weight_decay: 0.01
  num_codebooks: 8
  per_chip_batch: 2
  batch_size: 4  # fallback; per_chip_batch drives multi-host
  grad_accum: 1
  max_steps: 40
  warmup_steps: 5
  min_lr_ratio: 0.0
  early_stop_patience: 0
  compile_warmup_steps: 1
  enable_clip_grad_norm: true
  clip_grad_norm: 1.0
  log_grad_norm: true
  fsdp_barrier_hook: false
  # Graph break per micro-batch + fewer/larger depth chunks: both target the
  # 82.5% HBM fragmentation seen when 8 micros x 19 depth chunks trace into
  # one program (81.08G "used" over 14.21G of real buffers).
  micro_mark_step: true
  depth_chunk_size: 100
  precision: bfloat16
  use_scan_layers: true
  xla_grad_checkpoint: true
  final_canonical_save: false
  debug_input_sharding: true
loss:
  text_weight: 0.2
  audio_weight: 1.0
  text_weight_curriculum_frac: 0.0
  composite_text_w: 0.4
  composite_audio_w: 0.6
  text_padding_weight: 0.01
  zero_padding_weight: 0.0
  label_smoothing: 0.1
  per_codebook_multipliers:
  - 1.0
  - 1.0
  - 1.5
  - 1.5
  - 2.0
  - 2.0
  - 2.0
  - 2.0
  progressive_unmask_fraction: 0.1
  unmask_k0: 1
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  use_rslora: true
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - embed_tokens
  lora_exclude_top: 2
  num_full_ft_layers: 0
  depth_unfreeze_blocks: 0
optim:
  lr_lora: 0.0001716
  lr_full_ft: 5.0e-05
  lr_projection: 0.0005
  lr_depth: 0.0001
  lr_depth_blocks: 1.0e-05
  lr_audio_embed: 0.0005
  lr_text_embed: 0.0005
logging:
  log_every: 5
  save_every: 100000
  audio_every: 1000000
  val_every: 20
  val_max_batches: 10
  val_on_tpu: true
  # true = validation vehicle for the per-group diag/* telemetry (weight/grad
  # RMS + update sizes): the smoke is where the extra log-boundary graph
  # variant gets its compile checked before production.
  diag_metrics: true
  save_dir: gs://tinyaya-stage2-eu/checkpoints/mh-smoke/v6e16
  keep_last_n: 1
  keep_local_checkpoints: false
  use_wandb: true
  wandb_project: tinyaya-stage2-tpu
  wandb_run_name: mh-smoke-v6e16
  wandb_group: v03-mh-smoke
perf:
  enabled: true
  warmup_skip_steps: 25
  xprof_trace_labels: false
