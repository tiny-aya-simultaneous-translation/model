# Probe 1a (pre-launch hardening): checkpoint-cadence + compile-cache run.
# Fresh 600-step run on the 4k subset. Verifies live: log-spaced saves
# {1,2,4,...,512} + save_every 500, keep-all, async upload with metadata-last
# gate + integrity manifest; kill/relaunch mid-run must resume AND hit the
# persistent XLA cache. Also the flash-attn OFF arm of the A/B (first 150
# steps) and the loss-overlay baseline for the HBM matrix (first 200 steps).
backend: tpu
data:
  encoded_dir: /mnt/data/encoded
  train_split: /mnt/data/splits/train.jsonl
  val_split: /mnt/data/splits/val.jsonl
  max_frames: 300
  audio_frame_rate: 12.5
  num_workers: 32
  pin_memory: false
train:
  weight_decay: 0.01
  num_codebooks: 8
  per_chip_batch: 2
  batch_size: 4
  grad_accum: 1
  max_steps: 600
  warmup_steps: 50
  min_lr_ratio: 0.0
  early_stop_patience: 0
  compile_warmup_steps: 1
  enable_clip_grad_norm: true
  clip_grad_norm: 1.0
  log_grad_norm: true
  fsdp_barrier_hook: false
  micro_mark_step: true
  depth_chunk_size: 100
  precision: bfloat16
  use_scan_layers: true
  xla_grad_checkpoint: true
  final_canonical_save: false
  scheduler_total_steps: 600
  schedule: wsd
  wsd_anneal_steps: 60
  seed: 1337
loss:
  text_weight: 0.2
  audio_weight: 1.0
  text_weight_curriculum_frac: 0.0
  composite_text_w: 0.4
  composite_audio_w: 0.6
  text_padding_weight: 0.01
  zero_padding_weight: 0.0
  label_smoothing: 0.1
  per_codebook_multipliers:
  - 1.0
  - 1.0
  - 1.5
  - 1.5
  - 2.0
  - 2.0
  - 2.0
  - 2.0
  progressive_unmask_fraction: 0.1
  unmask_k0: 1
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  use_rslora: true
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - embed_tokens
  lora_exclude_top: 0
  num_full_ft_layers: 0
  depth_unfreeze_blocks: 0
optim:
  lr_lora: 0.0001716
  lr_full_ft: 5.0e-05
  lr_projection: 0.0005
  lr_depth: 0.0001
  lr_depth_blocks: 1.0e-05
  lr_audio_embed: 0.0005
  lr_text_embed: 0.0005
logging:
  log_every: 25
  save_every: 500
  audio_every: 1000000
  val_every: 250
  val_max_batches: 25
  val_on_tpu: true
  diag_metrics: true
  save_dir: gs://tinyaya-stage2-eu/checkpoints/mh-cadence/v6e16
  keep_last_n: 0
  keep_local_checkpoints: false
  use_wandb: true
  wandb_project: tinyaya-stage2-tpu
  wandb_run_name: mh-cadence-v6e16
  wandb_group: v03-mh-hardening
  log_spaced_saves: true
  async_checkpoint_upload: true
perf:
  enabled: true
  warmup_skip_steps: 25
  xprof_trace_labels: true   # Probe 3 captures its xprof trace from this run
