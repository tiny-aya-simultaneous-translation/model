# GENERATED round-2 probe R3 -- global batch 512 (grad_accum 16) with ALL
# lrs scaled by sqrt(2) (the lr-rescaled large-batch test; plain b512@lr1x
# already lost as round-1 P3). Sample-matched to arm D: horizon 2500 steps
# = 5000@256 samples, warmup 25, val every 125, stop at 750 (=384k samples).
backend: tpu
data:
  encoded_dir: /mnt/data/encoded
  train_split: /mnt/data/splits/train.jsonl
  val_split: /mnt/data/splits/val.jsonl
  max_frames: 300
  audio_frame_rate: 12.5
  num_workers: 32
  pin_memory: false
train:
  weight_decay: 0.01
  num_codebooks: 8
  batch_size: 4
  grad_accum: 16
  max_steps: 750
  warmup_steps: 25
  min_lr_ratio: 0.0
  early_stop_patience: 0
  compile_warmup_steps: 1
  enable_clip_grad_norm: true
  clip_grad_norm: 1.0
  log_grad_norm: true
  fsdp_barrier_hook: false
  micro_mark_step: true
  depth_chunk_size: 100
  precision: bfloat16
  use_scan_layers: true
  xla_grad_checkpoint: true
  final_canonical_save: false
  scheduler_total_steps: 2500
loss:
  text_weight: 0.2
  audio_weight: 1.0
  text_weight_curriculum_frac: 0.0
  composite_text_w: 0.4
  composite_audio_w: 0.6
  text_padding_weight: 0.01
  zero_padding_weight: 0.0
  label_smoothing: 0.1
  per_codebook_multipliers:
  - 1.0
  - 1.0
  - 1.5
  - 1.5
  - 2.0
  - 2.0
  - 2.0
  - 2.0
  progressive_unmask_fraction: 0.1
  unmask_k0: 1
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  use_rslora: true
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - embed_tokens
  lora_exclude_top: 0
  num_full_ft_layers: 0
  depth_unfreeze_blocks: 0
optim:
  lr_lora: 0.000242679
  lr_full_ft: 7.07107e-05
  lr_projection: 0.0007071068
  lr_depth: 0.0001414214
  lr_depth_blocks: 1.41421e-05
  lr_audio_embed: 0.0007071068
  lr_text_embed: 0.0007071068
logging:
  log_every: 25
  save_every: 500
  audio_every: 1000000
  val_every: 125
  val_max_batches: 25
  val_on_tpu: true
  diag_metrics: true
  save_dir: gs://tinyaya-stage2-eu/checkpoints/stage2-prod-probes-r2/r3-b512-sqrt2lr
  keep_last_n: 1
  keep_local_checkpoints: false
  use_wandb: true
  wandb_project: tinyaya-stage2-tpu
  wandb_run_name: v03-probe2-r3-b512-sqrt2lr
  wandb_group: v03-prod-probes-r2
perf:
  enabled: true
  warmup_skip_steps: 25
  xprof_trace_labels: false
