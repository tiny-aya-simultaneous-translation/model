# TPU v6e-8 REVAL base config -- v0.3 long-horizon re-validation (arm A = champion).
#
# WHY THIS EXISTS
# ---------------
# The v0.3 recipe (r=32, lr_lora=1.716e-4, +MLP, rsLoRA) was chosen by a sweep
# that ran only 1,500 steps on the 200K subset with the per-codebook accuracy
# metric broken. Before the 14,532-step full-corpus production run, six recipe
# arms are re-validated at a 5,000-step (~1.03-epoch) horizon on the FULL corpus
# using the now-trustworthy val/eval pipeline (per-CB acc 8854698 + checkpoint
# scan-remap loader eb17609). See docs/v0.3-reval-sweep-plan.md.
#
# This file is arm A (the frozen champion) AND the base that
# scripts/tpu/launch_reval_arms.sh derives arms B..F from (it overlays the
# per-arm recipe knobs + a distinct save_dir/wandb_run_name and materialises
# configs/tpu/reval/arm_<X>.yaml). Each arm runs on its OWN single-host v6e-8,
# so there is NO multi-host coordinator -- a plain per-slice CONFIG_FILE run.
#
# TPU note: v6e-8 = ONE host with 8 chips. Global batch is held at 256 to match
# the production regime, so grad_accum is 8 here (4 x 8 x 8 = 256) vs the
# v6e-16's grad_accum 4 (4 x 4 x 16 = 256). Per-chip batch 4 is validated-safe
# (v6e NaN'd at 16/chip).

backend: tpu

data:
  encoded_dir: /mnt/data/encoded
  train_split: /mnt/data/splits/train.jsonl
  val_split: /mnt/data/splits/val.jsonl
  max_frames: 300
  audio_frame_rate: 12.5
  num_workers: 32
  pin_memory: false

train:
  weight_decay: 0.01              # arm E overrides to 0.05 (regularization probe)
  num_codebooks: 8
  batch_size: 4                   # per-chip (validated safe); 4 x 8 x 8 = global 256
  grad_accum: 8                   # v6e-8: 8 chips -> grad_accum 8 holds global batch 256
  max_steps: 5000                 # ~1.03 epochs (1,178,302 / 256 ~= 4603 steps/epoch)
  warmup_steps: 50                # ~1% of max_steps
  min_lr_ratio: 0.0
  early_stop_patience: 0          # OFF -- every arm runs the full 5000 for a fair compare
  compile_warmup_steps: 1
  enable_clip_grad_norm: true
  clip_grad_norm: 1.0
  log_grad_norm: true
  fsdp_barrier_hook: false
  # micro_mark_step + depth_chunk 100: REQUIRED with scan on v6e-8. One graph
  # per macro-step fragments the XLA allocator to death (81G "used" over 14.2G
  # real buffers, 82.5% fragmentation -- verified 2026-07-08 on smoke-scan2);
  # a graph break per micro-batch + 3 (not 19) depth chunks fixed it:
  # step 5 ran at peak 26.22G/31.25G per chip.
  micro_mark_step: true
  depth_chunk_size: 100
  precision: bfloat16
  use_scan_layers: true           # REQUIRED on full-corpus 300-frame seqs: scan collapses
                                  # the 36 backbone layers into ONE scanned op so XLA does
                                  # not unroll them at compile -- scan=false OOMs at ~64G
                                  # (2x a v6e chip) on a single-host v6e-8 (verified 2026-07-07,
                                  # all 6 arms). Checkpoint load/save is scan-namespace-safe
                                  # since eb17609 (#71). The v6e-16 production config has the
                                  # same latent bug and must flip this too before its full run.
  xla_grad_checkpoint: true
  final_canonical_save: false     # probe run -- no publishable final artifact

loss:
  # TEXT+AUDIO (2026-07-08 pivot). The "corpus has no text alignments" premise
  # was FALSE: 840,426 .src + 840,426 .tgt alignments.json ship at the data
  # root (100% coverage); the old check used legacy filenames. Loader fixed in
  # src/data/dataset.py (_resolve_alignment). Constant text weight (no
  # curriculum) keeps the arm comparison clean; composite 0.4/0.6 drives
  # in-run best_by_val only -- final arm ranking is recomputed post-hoc across
  # weightings from the logged val/{text,audio}_loss series (sweep plan §5).
  text_weight: 0.2
  audio_weight: 1.0
  text_weight_curriculum_frac: 0.0
  composite_text_w: 0.4
  composite_audio_w: 0.6
  text_padding_weight: 0.01
  zero_padding_weight: 0.0
  label_smoothing: 0.1
  per_codebook_multipliers: [1.0, 1.0, 1.5, 1.5, 2.0, 2.0, 2.0, 2.0]
  progressive_unmask_fraction: 0.10
  unmask_k0: 1

lora:
  r: 32                            # arm A champion; B->64, C->16
  alpha: 64                        # 2 x r (rsLoRA convention); regenerated per arm
  dropout: 0.05                    # arm E overrides to 0.10
  use_rslora: true
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, embed_tokens]
  lora_exclude_top: 2              # arm D overrides to 0 (full-depth LoRA probe)
  num_full_ft_layers: 0
  depth_unfreeze_blocks: 0         # arm F overrides to 2 (CB1-7 capacity probe)

optim:
  lr_lora: 1.716e-4                # arm A champion; B->1.2e-4, C->2.4e-4
  lr_full_ft: 5.0e-5
  lr_projection: 5.0e-4
  lr_depth: 1.0e-4
  lr_depth_blocks: 1.0e-5          # only used when depth_unfreeze_blocks > 0 (arm F)
  lr_audio_embed: 5.0e-4
  lr_text_embed: 5.0e-4

logging:
  log_every: 25
  save_every: 500                 # 10 saves over 5000 steps
  audio_every: 1000000
  val_every: 250                  # 20 val cycles -> dense slope for the 3.5k->5k tiebreak
  val_max_batches: 25
  val_on_tpu: true
  diag_metrics: false
  save_dir: gs://tinyaya-stage2-eu/checkpoints/stage2-reval-5k/arm_A
  keep_last_n: 3                  # probe run: last 3 steps + best_by_val (never pruned)
  keep_local_checkpoints: false
  use_wandb: true
  wandb_project: tinyaya-stage2-tpu
  wandb_run_name: v03-reval-arm_A
  wandb_group: v03-5k-reval

perf:
  enabled: true
  warmup_skip_steps: 25
  xprof_trace_labels: false
