# TPU v6e-16 PRODUCTION run v0.3: text+audio, reval winner (arm D), 3 epochs.
#
# RECIPE PROVENANCE (2026-07-09): the v03-5k-reval-ta sweep (6 arms x 5,000
# full-corpus text+audio steps, docs/v0.3-reval-report.md) re-picked the
# recipe. Winner = arm D: the r=32/lr=1.716e-4/+MLP/rsLoRA base with
# lora_exclude_top: 0 (adapters on ALL 36 layers) -- gates-clean at every
# composite weighting; the old frozen champion (exclude_top=2) finished LAST.
# Pipeline validated by the 32-sample memorization gate + TF/AR examination
# (PR #10 gate report) before this config is allowed to launch.
#
# WHY THIS EXISTS
# ---------------
# The Stage-1/2 capacity sweep only ever trained on the 200K GCS SUBSET for
# 1,500 steps -- 0.31 epochs of the real 1.24M corpus. Before committing to
# a full 3-epoch (14,532-step) production run on the winning recipe
# (lr_lora=1.716e-4, lora_r=32, +MLP structure), this smoke test re-validates
# it on the FULL corpus for ~5,000 steps (~1.04 epochs), in parallel with two
# other Stage-2 candidates (r=8 and r=64) on separate TPU v6e-16 slices
# across two TRC zones (europe-west4-a + us-east1-d).
#
# If this arm still wins on real full-corpus data diversity, it gets
# EXTENDED IN PLACE: bump train.max_steps from 5000 to 14532 and re-run
# --resume auto on the SAME slice/save_dir/W&B run -- no new config, no
# restart. This file IS the production config once that happens.
#
# data.* paths are populated by scripts/tpu/startup_script.sh's plain
# (non-sweep) branch -- MUST clear /mnt/data/encoded + /mnt/data/splits and
# the sweep-data-gs-uri boot metadata first, or the host silently keeps the
# stale 200K sweep subset (same .unpacked marker gates both paths).

backend: tpu

data:
  encoded_dir: /mnt/data/encoded
  train_split: /mnt/data/splits/train.jsonl
  val_split: /mnt/data/splits/val.jsonl
  max_frames: 300
  audio_frame_rate: 12.5
  num_workers: 32
  pin_memory: false

train:
  weight_decay: 0.01              # de-regularized (overfitting isn't the constraint at this scale)
  num_codebooks: 8
  batch_size: 4                   # per-chip (validated safe); 4 x 4 x 16 = global 256
  grad_accum: 4
  max_steps: 14532                # 3 epochs (1,240,000/256 ~= 4844 steps/epoch x 3)
  warmup_steps: 150               # ~1% of max_steps
  min_lr_ratio: 0.0
  early_stop_patience: 6          # 6 val cycles (1500 steps) no-improvement -> stop; safety net past the validated 0.31-epoch regime
  compile_warmup_steps: 1
  enable_clip_grad_norm: true
  clip_grad_norm: 1.0
  log_grad_norm: true
  fsdp_barrier_hook: false
  # Scan recipe (2026-07-08, proven on v6e-8 smoke + arms): scan collapses the
  # 36 backbone layers into one HLO; micro_mark_step breaks the graph per
  # grad-accum micro-batch (one macro-graph = 82.5% XLA allocator
  # fragmentation); depth_chunk 100 = 3 large depth graphs instead of 19.
  # The old unrolled path (scan=false) OOMs single-host v6e-8 and carries the
  # same latent MoshiFlexibleLinear broadcast bug everywhere.
  micro_mark_step: true
  depth_chunk_size: 100
  precision: bfloat16
  use_scan_layers: true
  xla_grad_checkpoint: true
  final_canonical_save: true      # production: publishable final safetensors artifact

loss:
  # TEXT+AUDIO (2026-07-08 pivot): the "no text alignments" premise was FALSE
  # -- 840,426 .src + .tgt alignments.json ship at the data root (100%
  # coverage); the old check used legacy filenames. Loader fixed in
  # src/data/dataset.py. Winner hyperparameters from the v03-5k-reval-ta sweep
  # land here before the production launch (sweep plan Phase 3).
  text_weight: 0.2
  audio_weight: 1.0
  text_weight_curriculum_frac: 0.0
  composite_text_w: 0.4
  composite_audio_w: 0.6
  text_padding_weight: 0.01
  zero_padding_weight: 0.0
  label_smoothing: 0.1
  per_codebook_multipliers: [1.0, 1.0, 1.5, 1.5, 2.0, 2.0, 2.0, 2.0]
  progressive_unmask_fraction: 0.10
  unmask_k0: 1

lora:
  r: 32                            # Stage-2 sweep winner
  alpha: 64                        # 2 x r (rsLoRA convention)
  dropout: 0.05                    # de-regularized
  use_rslora: true                 # Stage-2 winner used rsLoRA (rank>=16)
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, embed_tokens]  # Stage-1 +MLP winner
  lora_exclude_top: 0             # reval winner (arm D): adapters on ALL 36 layers
  num_full_ft_layers: 0
  depth_unfreeze_blocks: 0

optim:
  lr_lora: 1.716e-4                # Stage-2 sweep winner (run a1bluw6u)
  lr_full_ft: 5.0e-5
  lr_projection: 5.0e-4
  lr_depth: 1.0e-4
  lr_depth_blocks: 1.0e-5
  lr_audio_embed: 5.0e-4
  lr_text_embed: 5.0e-4

logging:
  log_every: 25
  save_every: 500                 # CHECKPOINT every 500 steps (resumable + retained)
  audio_every: 1000000
  val_every: 250
  val_max_batches: 25
  val_on_tpu: true
  # Per-group stability dashboard (diag/*): grad/weight norms + RMS, lr*grad
  # and Adam update sizes, clip_coef. On-device reductions fold into the
  # log-boundary graph only (one extra compile of that variant, no per-step
  # cost). Enabled for production 2026-07-10 so grad-norm spikes can be read
  # against weight scale per group.
  diag_metrics: true
  save_dir: gs://tinyaya-stage2-eu/checkpoints/stage2-tpu-v6e16-full-v03
  keep_last_n: 0                  # keep ALL checkpoints
  keep_local_checkpoints: false
  use_wandb: true
  wandb_project: tinyaya-stage2-tpu
  wandb_run_name: v0.3-production

perf:
  enabled: true
  warmup_skip_steps: 25
  xprof_trace_labels: false
