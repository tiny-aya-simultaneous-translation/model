# GPU reproduction template — Stage-2 on the 26k-parallel subset (the pilot recipe).
# Fill in the placeholder paths / hub id below for your environment, then run:
#   torchrun --standalone --nproc_per_node=<N> scripts/train_hierarchical.py \
#            --config configs/gpu/stage2_26k_parallel.yaml
data:
  train_split: data/splits/train_26k.jsonl   # <- point at your staged splits
  val_split: data/splits/val_500.jsonl
  encoded_dir: data/encoded                  # <- point at your Mimi-encoded corpus
  max_frames: 300
  audio_frame_rate: 12.5
  num_workers: 4
  pin_memory: true
train:
  num_codebooks: 8
  batch_size: 2
  grad_accum: 2
  max_steps: 5000
  warmup_steps: 200
  min_lr_ratio: 0.1
  depth_chunk_size: 16
  precision: bfloat16
  max_grad_norm: 1.0
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-8
  ss_max_ratio: 0.3
  ss_warmup_steps: 2000
loss:
  text_weight: 0.1
  audio_weight: 1.0
  # Phase 0 fix (ported from the TPU run): down-weight the special padding
  # tokens (262144-262147) in the text CE so the un-learnable, mean-init
  # padding rows don't pin text loss at ~ln(V). Applies on any backend.
  text_padding_weight: 0.01
  zero_padding_weight: 0.0
optim:
  lr_lora: 3.0e-4
  lr_full_ft: 1.0e-4
  lr_projection: 1.0e-3
  lr_depth: 5.0e-4
  lr_audio_embed: 1.0e-3
  lr_text_embed: 1.0e-3
  lr_model_audio_embed: 1.0e-3
logging:
  log_every: 10
  save_every: 250
  audio_every: 500
  val_every: 250
  save_dir: checkpoints/stage2_26k_parallel
  wandb_project: tinyaya-s2s
  wandb_run_name: 26k_parallel_moshi_full
  use_wandb: true
  push_to_hub: false                         # <- set true + your repo below to push
  hub_repo_id: your-hf-username/tinyaya-s2s-stage2
