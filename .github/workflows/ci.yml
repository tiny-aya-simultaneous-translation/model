name: ci

# Lightweight, dependency-free checks that protect the dual-backend seam and
# catch obvious breakage without needing torch / torch_xla / a TPU. Heavier
# unit tests run separately (they need the model deps installed).
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing in this workflow writes to the repo.
permissions:
  contents: read

# A newer push to the same PR/branch supersedes the running job.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seam-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Backend seam (no module-level torch_xla in shared code)
        run: bash scripts/ci/check_backend_seam.sh
      - name: Docs consistency (batch semantics, run config, naming)
        run: bash scripts/ci/check_docs_sync.sh

      # CONTRIBUTING makes `ruff check .` a contributor requirement and
      # pyproject configures it, but nothing enforced it until now.
      - name: Lint (ruff)
        run: |
          python3 -m pip install --quiet ruff
          ruff check .

      # Compile EVERY tracked Python file. The previous hardcoded five-file
      # list guarded each entry with `test -f`, so a renamed or deleted script
      # was skipped silently and coverage could rot to zero without CI failing.
      - name: Byte-compile all Python sources
        run: |
          find src scripts tests .claude -name '*.py' -print0 \
            | xargs -0 -n1 python3 -m py_compile

      - name: Parse all YAML configs + sweeps
        run: |
          python3 -m pip install --quiet pyyaml
          for y in configs/*/*.yaml sweeps/*.yaml; do
            python3 -c "import yaml; yaml.safe_load(open('$y'))"
          done

      - name: Shell scripts parse
        run: bash -n scripts/*.sh scripts/tpu/*.sh scripts/ci/*.sh

      - name: Torch-free unit tests
        run: |
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest tests/ -q
