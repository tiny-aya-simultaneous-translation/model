version: 2
updates:
  # Python deps. Monthly, not weekly: this is a research repo whose stack is
  # pinned and live-validated, so most bumps here need a re-validation run
  # rather than a merge.
  #
  # The `ignore` list below is NOT laziness -- every entry is a pin dependabot
  # cannot reason about, and each one has already produced a wrong PR or would
  # have. Note that CI is deliberately torch-free (`pytest` + `pyyaml` only), so
  # a green check on a dependency PR proves nothing about these packages: none
  # of them are even imported during CI.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # --- the transformers pin and everything chained to it ---
      # 4.57+/5.x break the Cohere2 + Moshi internals this project patches
      # (proven on live TPU runs). transformers<5 in turn requires
      # huggingface-hub<1.0, so the hub cap is downstream of the same decision
      # and cannot be raised independently.
      - dependency-name: "transformers"
      - dependency-name: "huggingface-hub"
      - dependency-name: "peft"
      - dependency-name: "accelerate"

      # --- torch, routed per dependency-group ---
      # torch/torchaudio resolve from different indexes in the mutually
      # exclusive `tpu` (CPU wheels) and `cuda` (cu128) groups. Dependabot sees
      # one requirement, not the split, so its bumps would be wrong for one of
      # the two environments.
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      - dependency-name: "torch-xla"

      # --- the torch_xla scan-backward trio, pinned as a matched set ---
      # torch_xla's scan backward under SPMD traces jax.experimental.shard_alike
      # via xb.call_jax, which also hard-requires torchax. torch_xla's own
      # `pallas` extra pins jax==0.7.1/jaxlib==0.7.1, and we match it. Bumping
      # any one of these alone desyncs the set, and the failure only appears on
      # the first scanned backward on real TPU hardware.
      - dependency-name: "jax"
      - dependency-name: "jaxlib"
      - dependency-name: "torchax"

  # GitHub Actions bumps are safe to take: the workflow runs from the PR branch,
  # so a green check here genuinely exercises the new action versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
